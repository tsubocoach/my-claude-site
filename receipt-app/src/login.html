<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシート → freee</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; --err:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b22; --fg:#e8eaf0; --muted:#9aa3b2; --line:#2a2f3a; --accent:#5b8cff; } }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--fg); display:grid; place-items:center; min-height:100vh; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; width:min(340px, calc(100vw - 32px)); box-sizing:border-box; }
  h1 { font-size:18px; margin:0 0 16px; }
  input, button { width:100%; box-sizing:border-box; font-size:16px; padding:12px; border-radius:10px; }
  input { border:1px solid var(--line); background:var(--bg); color:var(--fg); margin-bottom:12px; }
  button { border:0; background:var(--accent); color:#fff; font-weight:600; }
  .err { color:var(--err); font-size:14px; min-height:1em; margin-bottom:8px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>🧾 レシート → freee</h1>
  <div class="err"><!--ERR--></div>
  <input type="password" name="password" placeholder="パスワード" autocomplete="current-password" required autofocus>
  <button type="submit">ログイン</button>
</form>
</body>
</html>
